; MultiLobeSpec plugin config (branch "MultiLobeSpec", loaded by the plugin manager for the enabled plugin; InitUObject reads
; the [CoreRedirects] section of every loaded ini, the same convention as Engine/Plugins/*/Config/Default<Plugin>.ini).
;
; W38 FogMS Multiple Scattering Look: the W37 forward-lobe properties of AFogMSBoxVolume were renamed to the shared,
; UE-Volumetric-Cloud-style set, so levels saved with the old names keep their values:
;   Forward Anisotropy -> Phase G, Forward Scattering -> MS Contribution, Forward Depth -> MS Occlusion,
;   Back Floor -> MS Back Floor. (MS Eccentricity is new; the W37 lobe used a fixed 0.5.)
; Only values that differed from the class default were saved. A Box that saved both names of one property (MS Contribution
; set for Octaves and Forward Scattering set for the lobe) keeps whichever was serialized last; check such a Box after loading.
[CoreRedirects]
+PropertyRedirects=(OldName="/Script/MultiLobeSpec.FogMSBoxVolume.ForwardAnisotropy",NewName="/Script/MultiLobeSpec.FogMSBoxVolume.PhaseG")
+PropertyRedirects=(OldName="/Script/MultiLobeSpec.FogMSBoxVolume.ForwardScattering",NewName="/Script/MultiLobeSpec.FogMSBoxVolume.MSContribution")
+PropertyRedirects=(OldName="/Script/MultiLobeSpec.FogMSBoxVolume.ForwardDepth",NewName="/Script/MultiLobeSpec.FogMSBoxVolume.MSOcclusion")
+PropertyRedirects=(OldName="/Script/MultiLobeSpec.FogMSBoxVolume.BackFloor",NewName="/Script/MultiLobeSpec.FogMSBoxVolume.MSBackFloor")
